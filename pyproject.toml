[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metax-mxtop"
version = "0.1.25"
description = "An nvitop-like terminal monitor for MetaX GPUs."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "mxtop contributors" }]
license = "MIT"
keywords = ["metax", "mx-smi", "maca", "gpu", "monitoring", "top"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.6", "tomli>=1.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/linkedlist771/metax-mxtop"
Repository = "https://github.com/linkedlist771/metax-mxtop.git"
Documentation = "https://github.com/linkedlist771/metax-mxtop#readme"
Changelog = "https://github.com/linkedlist771/metax-mxtop/blob/main/CHANGELOG.md"
Contributing = "https://github.com/linkedlist771/metax-mxtop/blob/main/CONTRIBUTING.md"
Security = "https://github.com/linkedlist771/metax-mxtop/blob/main/SECURITY.md"
Issues = "https://github.com/linkedlist771/metax-mxtop/issues"

[project.optional-dependencies]
remote = ["asyncssh>=2.14"]
dev = [
    "build>=1.2",
    "pillow==11.3.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
    "twine>=6",
]

[project.scripts]
mxtop = "mxtop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mxtop.remote" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/mxtop.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mxtop"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.basedpyright]
stubPath = "typings"
typeCheckingMode = "basic"
