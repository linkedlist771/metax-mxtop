name: Test, build, and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[remote,dev]'

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -m pytest -q

      - name: Run tests with branch coverage
        if: matrix.python-version == '3.13'
        run: python -m pytest -q --cov --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=75

  linux-x86_64-wheelhouse:
    name: Build Linux x86_64 offline wheelhouse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install project and build/test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Verify release tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/pytest-output.log
          status=${PIPESTATUS[0]}
          if [[ "${status}" -ne 0 ]]; then
            python - <<'PY'
          from pathlib import Path

          output = Path("/tmp/pytest-output.log").read_text(errors="replace")[-12000:]
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failure::{escaped}")
          PY
          fi
          exit "${status}"

      - name: Run lint
        run: ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dashboard browser tooling
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Run dashboard browser tests
        env:
          PYTHON: python
        run: npm run test:dashboard

      - name: Build project distributions
        run: python -m build

      - name: Validate project distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Build Linux x86_64 offline wheelhouse
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
          python -m pip download \
            --dest wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --platform manylinux2010_x86_64 \
            --implementation cp \
            --python-version "39" \
            --abi cp39 \
            --abi abi3 \
            --abi none \
            dist/*.whl
          tar -czf metax-mxtop-linux-x86_64-wheelhouse.tar.gz -C wheelhouse .

      - name: Verify offline install
        run: |
          python -m pip install \
            --no-index \
            --find-links wheelhouse \
            --target offline-test \
            metax-mxtop
          PYTHONPATH=offline-test python -m mxtop.cli --version

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz metax-mxtop-linux-x86_64-wheelhouse.tar.gz > SHA256SUMS.txt

      - name: Generate release notes
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/extract_release_notes.py "${GITHUB_REF_NAME}" --output release-notes.md
          else
            printf 'Automated Linux x86_64 wheel build for commit %s.\n' "${GITHUB_SHA}" > release-notes.md
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: metax-mxtop-release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            metax-mxtop-linux-x86_64-wheelhouse.tar.gz
            SHA256SUMS.txt
            release-notes.md
          if-no-files-found: error

      - name: Upload dashboard browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dashboard-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: [test-matrix, linux-x86_64-wheelhouse]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: metax-mxtop-release-artifacts
          path: release-assets

      - name: Verify downloaded artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
            create_args=(--verify-tag)
          else
            short_sha="${GITHUB_SHA::7}"
            tag="build-${GITHUB_SHA}"
            title="Build ${short_sha}"
            create_args=(--target "${GITHUB_SHA}" --prerelease)
          fi

          mapfile -t assets < <(find release-assets -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) | sort)

          if gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error title=Release already exists::Refusing to replace assets for ${tag}."
              exit 1
            fi

            if ! diff -u \
              <(printf '%s\n' "${assets[@]##*/}" | sort) \
              <(gh release view "${tag}" --json assets --jq '.assets[].name' | sort); then
              echo "::error title=Incomplete existing prerelease::${tag} exists with a different asset set; refusing to mutate it."
              exit 1
            fi
            echo "${tag} already contains the complete release asset set; leaving it unchanged."
            exit 0
          fi

          gh release create "${tag}" \
            "${assets[@]}" \
            --title "${title}" \
            --notes-file release-assets/release-notes.md \
            "${create_args[@]}"

  pypi-release:
    name: Publish PyPI package
    needs: [test-matrix, linux-x86_64-wheelhouse]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/metax-mxtop
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: metax-mxtop-release-artifacts
          path: release-assets

      - name: Verify downloaded artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          packages-dir: release-assets/dist
