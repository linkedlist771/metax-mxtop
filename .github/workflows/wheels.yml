name: Build and release wheels

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tooling
        run: python -m pip install --upgrade pip pillow==11.3.0 psutil pytest pytest-cov

      - name: Install project with remote extra
        run: python -m pip install --editable '.[remote]'

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -m pytest -q

      - name: Run tests with branch coverage
        if: matrix.python-version == '3.13'
        run: python -m pytest -q --cov --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=75

  linux-x86_64-wheelhouse:
    name: Build Linux x86_64 offline wheelhouse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build and test tooling
        run: python -m pip install --upgrade pip build pillow==11.3.0 psutil pytest ruff

      - name: Install project
        run: python -m pip install --editable .

      - name: Verify release tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/pytest-output.log
          status=${PIPESTATUS[0]}
          if [[ "${status}" -ne 0 ]]; then
            python - <<'PY'
          from pathlib import Path

          output = Path("/tmp/pytest-output.log").read_text(errors="replace")[-12000:]
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failure::{escaped}")
          PY
          fi
          exit "${status}"

      - name: Run lint
        run: ruff check .

      - name: Build project wheel
        run: python -m build --wheel

      - name: Build Linux x86_64 offline wheelhouse
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
          python -m pip download \
            --dest wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --platform manylinux2010_x86_64 \
            --implementation cp \
            --python-version "39" \
            --abi cp39 \
            --abi abi3 \
            --abi none \
            dist/*.whl
          tar -czf metax-mxtop-linux-x86_64-wheelhouse.tar.gz -C wheelhouse .

      - name: Verify offline install
        run: |
          python -m pip install \
            --no-index \
            --find-links wheelhouse \
            --target offline-test \
            metax-mxtop
          PYTHONPATH=offline-test python -m mxtop.cli --version

      - name: Generate checksums
        run: sha256sum dist/*.whl metax-mxtop-linux-x86_64-wheelhouse.tar.gz > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: metax-mxtop-linux-x86_64-wheels
          path: |
            dist/*.whl
            metax-mxtop-linux-x86_64-wheelhouse.tar.gz
            SHA256SUMS.txt

  github-release:
    name: Publish GitHub Release
    needs: linux-x86_64-wheelhouse
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: metax-mxtop-linux-x86_64-wheels
          path: release-assets

      - name: Verify downloaded artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
            python scripts/extract_release_notes.py "${tag}" --output /tmp/release-notes.md
            create_args=(--verify-tag)
          else
            short_sha="${GITHUB_SHA::7}"
            tag="build-${short_sha}"
            title="Build ${short_sha}"
            printf 'Automated Linux x86_64 wheel build for commit %s.\n' "${GITHUB_SHA}" > /tmp/release-notes.md
            create_args=(--target "${GITHUB_SHA}" --prerelease)
          fi

          mapfile -t assets < <(find release-assets -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) | sort)

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" --title "${title}" --notes-file /tmp/release-notes.md
          else
            gh release create "${tag}" \
              "${assets[@]}" \
              --title "${title}" \
              --notes-file /tmp/release-notes.md \
              "${create_args[@]}"
          fi

  pypi-release:
    name: Publish PyPI package
    needs: linux-x86_64-wheelhouse
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/metax-mxtop
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify release tag matches package metadata
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Build PyPI distributions
        run: python -m build

      - name: Validate PyPI distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
